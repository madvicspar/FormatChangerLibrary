name: Build and Test

env:
  DOTNET_VERSION: '8.0'
  POSTGRES_USER: testuser
  POSTGRES_PASSWORD: testpass
  POSTGRES_DB: testdb

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore & Build
        run: |
          cd backend
          dotnet restore
          dotnet build --configuration Release --no-restore

  # 🔹 Сборка Docker-образов
  build-docker:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: formatchecker-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: formatchecker-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker compose
        run: docker compose config

  # 🔹 Интеграционные тесты через Newman + docker compose
  integration-tests:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          EOF
          cat .env
          
      - name: Clean up previous volumes
        run: docker volume rm formatchangerlibrary_pgdata 2>/dev/null || true
        
      - name: Build and start stack
        run: docker compose up -d --build
        
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c '
            until docker compose exec -T db pg_isready -q 2>/dev/null; do
              echo "⏳ DB not ready, retrying in 2s..."
              sleep 2
            done
          '
          echo "✅ PostgreSQL is ready!"

      - name: Wait for backend API
        run: |
          echo "Waiting for backend to be ready..."
          timeout 90 bash -c '
            until curl -s -f http://localhost/api/v1/templates; do
              echo "⏳ Backend not ready yet, retrying in 2s..."
              sleep 2
            done
          '
          echo "✅ Backend is up!"
          
      - name: Install Newman
        run: npm install -g newman
        
      - name: Run integration tests (Newman)
        run: |
          newman run tests/postman_collection.json \
            --environment tests/postman_env.json \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export results.xml
            
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results.xml
          retention-days: 7
          
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs backend db
        
      - name: Cleanup
        if: always()
        run: docker compose down -v
  
  deploy:
    needs: integration-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            yourusername/formatchecker-backend:latest
            yourusername/formatchecker-backend:${{ github.sha }}
            
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            yourusername/formatchecker-frontend:latest
            yourusername/formatchecker-frontend:${{ github.sha }}
